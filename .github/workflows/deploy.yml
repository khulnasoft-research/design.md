name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    environment:
      name: production
      url: https://design-md.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Build workspace packages
        run: bun run build
        env:
          VERCEL_ENV: production

      - name: Build playground
        run: cd packages/playground && bun run build
        env:
          VERCEL_ENV: production

      - name: Run tests
        run: bun run test

      - name: Deploy to Vercel Production
        run: npx vercel --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const url = status === 'success' ? 'https://design-md.vercel.app' : null;
            const message = status === 'success'
              ? `Deployment successful: ${url}`
              : 'Deployment failed';
            core.notice(message);
